plugins { id 'com.android.application' }
android {
    namespace 'com.consentnuker'
    compileSdk 34
    defaultConfig {
        applicationId "com.consentnuker"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {}
